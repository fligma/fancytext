[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fancytext"
version = "0.0.1"
description = "Ascii rendering package for python."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Fligma"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [

]

[project.urls]
Homepage = "https://github.com/fligma/fancytext"
Issues = "https://github.com/fligma/fancytext/issues"